<div class="relative inline-flex items-center leading-none">
  <button
    type="button"
    (click)="toggleOpen($event)"
    class="flex items-center gap-1.5 h-8 px-2.5 rounded-md text-[13px] font-medium text-[var(--color-text-secondary)] bg-transparent border border-black/10 hover:bg-black/5 hover:text-[var(--color-text)] focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-accent)] transition-colors"
  >
    <span class="text-sm leading-none">{{ selectedLanguage().flag }}</span>
    <span>{{ selectedLanguage().code | uppercase }}</span>
    <svg
      class="w-3 h-3 opacity-60 transition-transform duration-150"
      [class.rotate-180]="isOpen()"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute right-0 top-full mt-2 w-36 bg-white border border-black/10 rounded-lg shadow-lg z-50 overflow-hidden"
    >
      @for (lang of languages(); track lang.code) {
        <button
          type="button"
          (click)="selectLanguage(lang)"
          class="flex items-center gap-2 w-full px-3 py-2 text-[13px] text-left hover:bg-black/5 transition-colors"
          [class.font-semibold]="lang.code === selectedLanguage().code"
          [style.color]="lang.code === selectedLanguage().code ? 'var(--color-accent)' : null"
        >
          <span class="text-sm">{{ lang.flag }}</span>
          <span>{{ lang.name }}</span>
        </button>
      }
    </div>
  }
</div>
