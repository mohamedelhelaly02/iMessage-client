<main class="chat-main">
  <app-chat-header
    [isOtherUserTyping]="isOtherUserTyping()"
    [conversation]="selectedConversation()">
  </app-chat-header>
  <app-messages [isOtherUserTyping]="isOtherUserTyping()"></app-messages>
  <app-composer (onTyping)="onUserTyping()" (onMessageSend)="onMessageSend($event)"></app-composer>
</main>
