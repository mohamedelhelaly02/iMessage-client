<div class="auth-card" dir="rtl">
    <div class="auth-card__logo">
        <svg viewBox="0 0 24 24" fill="none">
            <path
                d="M12 3C6.9 3 2.8 6.4 2.8 10.6c0 2.5 1.4 4.7 3.6 6.1-.1.9-.5 2.2-1.4 3.3-.2.2 0 .5.3.5 1.7-.2 3.2-.9 4.2-1.6.8.2 1.7.3 2.5.3 5.1 0 9.2-3.4 9.2-7.6S17.1 3 12 3z"
                fill="url(#login-bubble-gradient)" />
            <defs>
                <linearGradient id="login-bubble-gradient" x1="2.8" y1="3" x2="21.2" y2="20.5"
                    gradientUnits="userSpaceOnUse">
                    <stop stop-color="#34c8ff" />
                    <stop offset="1" stop-color="#0a84ff" />
                </linearGradient>
            </defs>
        </svg>
    </div>

    <h1 class="auth-card__title">تسجيل الدخول</h1>
    <p class="auth-card__subtitle">أدخل بياناتك للمتابعة إلى محادثاتك</p>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
            <label class="form-field__label" for="email">البريد الإلكتروني</label>
            <input class="form-field__input" id="email" type="email" formControlName="email"
                placeholder="example@email.com" autocomplete="email" />
            @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <span class="form-field__error"> الرجاء إدخال بريد إلكتروني صحيح </span>
            }
        </div>

        <div class="form-field">
            <label class="form-field__label" for="password">كلمة المرور</label>
            <div class="form-field__input-wrap">
                <input class="form-field__input" id="password" type="password" formControlName="password"
                    placeholder="••••••••" autocomplete="current-password" />
            </div>
            @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <span class="form-field__error"> كلمة المرور مطلوبة </span>
            }
        </div>

        <button class="btn-primary" type="submit">تسجيل الدخول</button>
    </form>

    <p class="auth-card__footer">
        ليس لديك حساب؟
        <a>إنشاء حساب جديد</a>
    </p>
</div>
